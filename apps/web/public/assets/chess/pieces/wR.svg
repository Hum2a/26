<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
  Derived from the Cburnett chess set by Colin M. L. Burnett.
  Source: https://commons.wikimedia.org/wiki/File:Chess_rlt45.svg
  Licence chosen: 3-clause BSD (the set is multi-licensed
  BSD / GPL / GFDL / CC-BY-SA 3.0; we use the BSD option).
  Modifications: shared 512x512 viewBox with ~8% padding and
  consistent scale; carved/glossy ivory or ebony gradients;
  dark warm outline on white pieces; light cream rim on black.
  -->
  <defs>
    <linearGradient id="ivory" x1="0.18" y1="0.02" x2="0.88" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fffef6"/>
      <stop offset="16%" stop-color="#fff4de"/>
      <stop offset="38%" stop-color="#ead7b4"/>
      <stop offset="68%" stop-color="#d2bc91"/>
      <stop offset="100%" stop-color="#b89d72"/>
    </linearGradient>
    <linearGradient id="ebony" x1="0.18" y1="0.02" x2="0.88" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6e6256"/>
      <stop offset="14%" stop-color="#3f362f"/>
      <stop offset="40%" stop-color="#1c1814"/>
      <stop offset="72%" stop-color="#0d0b09"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.30" cy="0.18" r="0.65" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="piece" transform="translate(4.6545,10.2400) scale(11.170909)">
    <g style="opacity:1; fill:url(#ivory); fill-opacity:1; fill-rule:evenodd; stroke:#1c140c; stroke-width:1.5; stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4; stroke-dasharray:none; stroke-opacity:1;" transform="translate(0,0.3)">
